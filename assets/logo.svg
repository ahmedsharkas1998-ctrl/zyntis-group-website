    <text x="136" y="38" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="400" font-size="30" letter-spacing="0.10em" fill="#c8a44e">GROUP</text>
    <text x="2" y="58" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="11.5" letter-spacing="0.25em" fill="#dfc070">AI SYSTEMS &amp; INFRASTRUCTURE</text>
  </g>
