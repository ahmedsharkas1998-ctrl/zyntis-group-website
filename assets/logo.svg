    <path d="M38 20L48 20C54 20 59 24.5 59 30.5C59 36.5 54 41 48 41L34 41" stroke="#e8c65a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
    <!-- Glowing core nodes -->
    <circle cx="10" cy="4" r="3" fill="#ffffff" />
    <circle cx="42" cy="4" r="3" fill="#c8a44e" />
    <circle cx="18" cy="40" r="3" fill="#c8a44e" />
    <circle cx="50" cy="40" r="3" fill="#ffffff" />
    <circle cx="59" cy="30.5" r="2.2" fill="#e8c65a" />
